# Kitty must release these so herdr receives them. Kitty owns tabs and windows by
# default, which shadows herdr's own tabs and workspaces one layer down.

map ctrl+shift+t no_op
map ctrl+shift+w no_op
map ctrl+shift+q no_op
map ctrl+shift+bracket_left no_op
map ctrl+shift+bracket_right no_op
map ctrl+shift+p no_op

# Kitty does not bind ctrl+alt by default, so the workspace layer needs no unbinds
# here. GNOME grabs ctrl+alt+t at the desktop level -- see the README.
