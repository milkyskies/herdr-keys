onboarding = false

[keys]
prefix = "ctrl+space"
new_tab = ["cmd+shift+t", "ctrl+shift+t"]
close_tab = ["cmd+shift+w", "ctrl+shift+w"]
next_tab = ["cmd+shift+n", "ctrl+shift+n"]
previous_tab = ["cmd+shift+p", "ctrl+shift+p"]
new_workspace = ["cmd+alt+t", "ctrl+alt+t"]
close_workspace = ["cmd+alt+w", "ctrl+alt+w"]
next_workspace = ["cmd+alt+n", "ctrl+alt+n"]
previous_workspace = ["cmd+alt+p", "ctrl+alt+p"]
goto = ["cmd+shift+g", "ctrl+shift+g"]

[theme]
name = "catppuccin-frappe"
auto_switch = false
